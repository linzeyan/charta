name: deploy-pages

# The gallery at https://linzeyan.github.io/charta/: every demo chart as the Go
# port renders it, zoom wired through the wasm build (make site).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deploy under way finishes rather than leaving the site half updated.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build the gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # wasm-bindgen and wasm-opt, pinned in mise.toml.
      - uses: jdx/mise-action@v5
      - run: make site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
