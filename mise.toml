[tools]
# Must match the wasm-bindgen crate in Cargo.lock: the CLI refuses a .wasm
# built against another version.
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
# wasm-opt, which shrinks what wasm-bindgen emits (make wasm).
"github:WebAssembly/binaryen" = { version = "133", version_prefix = "version_" }
