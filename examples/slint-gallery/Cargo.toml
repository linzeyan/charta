[package]
name = "charta-slint-gallery"
version = "0.0.0"
edition = "2024"
publish = false
# Slint is GPL-3.0-only / royalty-free / commercial; this app uses it under GPL-3.0.
license = "GPL-3.0-only"

[dependencies]
charta = { path = "../..", features = ["slint"] }
charta-demos = { path = "../demos" }
slint = "1.18.1"

[dev-dependencies]
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "png-format"] }
