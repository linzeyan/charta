[package]
name = "charta-wasm"
version = "0.0.0"
edition = "2024"
description = "Zoom charta charts in the browser: the layout engine as WebAssembly, for zoom.js"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
charta = { path = "..", features = ["serde"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
